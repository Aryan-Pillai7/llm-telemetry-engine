# Dashboard provider. Dashboard JSON dropped into ./json/ is picked up on
# start and on the update interval below, so dashboards stay version
# controlled instead of living only in Grafana's database. Populated in Phase 5.

apiVersion: 1

providers:
  - name: telemetry
    orgId: 1
    folder: LLM Telemetry
    type: file
    disableDeletion: false
    # Edits made in the UI are overwritten from disk. That is deliberate: the
    # files are the source of truth, and a dashboard tweaked in a browser and
    # never committed is a dashboard that vanishes on the next nuke.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
