[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telemetry-engine"
version = "0.1.0"
description = "Streaming telemetry pipeline for LLM/agent workloads: OTel -> Redpanda -> ClickHouse -> Parquet"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Config / CLI
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "structlog>=24.1",
    # Storage clients
    "clickhouse-connect>=0.7",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    # Ingest-side admin (topic reconcile, consumer lag SLI)
    "confluent-kafka>=2.4",
    # Mock inference endpoints + OTLP instrumentation
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
telemetry-engine = "telemetry_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry_engine"]

# --- Lint / format -----------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

# --- Tests -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    # Integration tests need the docker compose stack up (`make up`). They are
    # deselected by default and in CI, which has no stack.
    "integration: requires a running docker compose stack",
]

[tool.mypy]
python_version = "3.11"
packages = ["telemetry_engine"]
mypy_path = "src"
ignore_missing_imports = true
