name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# A CI runner is already a disposable environment; the extra venv layer that
# tasks.py builds for local dev only slows the job down.
env:
  TE_NO_VENV: "1"

jobs:
  lint-and-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python tasks.py install

      - name: Lint
        run: python tasks.py lint

      # Unit tests only: CI has no docker stack, and integration tests are
      # deselected by the `not integration` marker expression.
      - name: Unit tests
        run: python tasks.py test

  validate-config:
    name: Validate infra config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # These steps become meaningful in Phase 1 when the config files land.
      # They are guarded so CI stays green until then rather than being added
      # after the fact and never wired up.
      - name: Validate docker compose file
        run: |
          if [ -f deploy/docker-compose.yml ]; then
            docker compose -f deploy/docker-compose.yml config --quiet
          else
            echo "deploy/docker-compose.yml not present yet (Phase 1) - skipping"
          fi

      - name: Validate OpenTelemetry Collector config
        run: |
          if [ -f deploy/otelcol/config.yaml ]; then
            docker run --rm -v "$PWD/deploy/otelcol:/cfg:ro" \
              otel/opentelemetry-collector-contrib:latest \
              validate --config=/cfg/config.yaml
          else
            echo "deploy/otelcol/config.yaml not present yet (Phase 1) - skipping"
          fi
