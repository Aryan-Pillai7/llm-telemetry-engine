name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# A CI runner is already a disposable environment; the extra venv layer that
# tasks.py builds for local dev only slows the job down.
env:
  TE_NO_VENV: "1"

jobs:
  static:
    name: Lint, types, inert guards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python tasks.py install

      - name: Lint
        run: python tasks.py lint

      - name: Type check
        # mypy was configured in pyproject from Phase 0 and invoked nowhere
        # until Phase 8. When first run it found 13 errors, including a
        # None-arithmetic bug in `rollup-backfill` that would have raised
        # TypeError on an empty database. A configured checker that nothing runs
        # is the same failure as a guard that is never called.
        run: python tasks.py typecheck

      - name: Documentation references
        # A dead markdown link and a Mermaid click target pointing at a moved
        # module both keep rendering perfectly. Same shape as an inert guard:
        # the mechanism still runs while pointing at nothing.
        run: python tasks.py check-docs

      - name: Inert guard audit
        # Finds checks that are defined but never invoked from the path they
        # protect. Runtime testing cannot catch these: an inert guard produces
        # no output, so nothing contradicts it and every test still passes.
        # Precedent: the cold-tier export's value-fingerprint check was written,
        # documented, and not called.
        run: python tasks.py audit-guards

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python tasks.py install

      - name: Unit tests with coverage
        run: python tasks.py coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: htmlcov/
          retention-days: 7

  config:
    name: Validate infra config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python tasks.py install

      - name: Validate docker compose file
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Validate OpenTelemetry Collector config
        # Against the real binary, at the pinned version. The kafka exporter
        # moved `topic`/`encoding` under a per-signal key in 0.159; a config
        # that parses in one version silently fails to start in another.
        run: |
          docker run --rm -v "$PWD/deploy/otelcol:/cfg:ro" \
            otel/opentelemetry-collector-contrib:0.159.0 \
            validate --config=/cfg/config.yaml

      - name: Check generated dashboards are current
        # The committed JSON is what Grafana provisions; the builder is what we
        # edit. If they drift, the dashboard in the running stack is not the one
        # under review.
        run: |
          python -m telemetry_engine.cli dashboards
          git diff --exit-code deploy/grafana/provisioning/dashboards/json/

  integration:
    name: End-to-end against a live stack
    runs-on: ubuntu-latest
    # The stack pull plus a load run needs real time; the default 6h is far too
    # generous and 10 minutes is too tight.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python tasks.py install

      - name: Start the stack
        # `up` waits for healthchecks, reconciles topics, applies migrations and
        # syncs the cardinality allowlist. If any of that regresses, this step
        # fails before a single test runs.
        run: python tasks.py up

      - name: Generate telemetry
        # Modest rate: a GitHub runner has fewer cores than the dev laptop, and
        # the point here is that data moves end to end, not how fast.
        run: |
          python -m telemetry_engine.cli load --duration 30 --rate 2000 --workers 2
          python -m telemetry_engine.cli monitor --interval 2 --duration 10

      - name: Wait for ingest to settle
        # Ingest is asynchronous: the SDK batches, the collector batches, and
        # ClickHouse flushes Kafka blocks every 3s. Asserting immediately would
        # test the timing, not the pipeline.
        run: python -c "import time; time.sleep(20)"

      - name: Export the cold tier
        # Before the integration tests, not after: the cold-tier tests assert
        # against a populated lake and fail loudly when there is not one. They
        # deliberately do not skip -- a test that skips when the exporter
        # produced nothing is indistinguishable from a test that passed, which
        # is the failure mode this project keeps designing against.
        # --lag-margin-seconds 10 rather than the 5-minute default: everything
        # this job generated is seconds old, so the safe default would export
        # nothing and the cold-tier tests would have no lake to assert against.
        run: python -m telemetry_engine.cli cold export --lag-margin-seconds 10

      - name: Integration tests
        run: python tasks.py test-integration

      - name: Verify the cold tier
        run: |
          python -m telemetry_engine.cli cold verify
          python -m telemetry_engine.cli cold status

      - name: Verify every dashboard panel against ClickHouse
        run: python scripts/verify_dashboards.py

      - name: Verify every dashboard panel through Grafana
        # Distinct from the step above and not redundant: the SQL can be valid
        # while every panel fails. Grafana's own global time variables are
        # interpolated by the frontend, so queries using them passed direct SQL
        # verification and failed through this path.
        run: python scripts/verify_grafana.py

      - name: Stack diagnostics on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml ps
          docker compose -f deploy/docker-compose.yml logs --tail 100

      - name: Tear down
        if: always()
        run: python tasks.py nuke
